        <h1>Sanapiilo – suomalainen sanapeli verkossa</h1>
        <p>Sanapiilo on ilmainen selaimessa pelattava sanapeli. Pelikenttänä on kuusikulmioista koostuva kennoruudukko, jonka kirjaimista muodostat sanoja vetämällä sormella tai hiirellä vierekkäisten kirjainten yli. Mitä pidempi sana, sitä enemmän pisteitä, ja nopeasti peräkkäin löydetyt sanat kasvattavat komboa.</p>
        <p>Pelitiloja on kaksi: <strong>online-peli</strong>, jossa kaikki paikalla olevat pelaajat etsivät sanoja samasta ruudukosta kahden minuutin kierroksissa, ja <strong>harjoittelu</strong>, jossa pelaat yksin valitsemallasi ajalla. Peli tukee suomea, ruotsia ja englantia, ja hyväksyy sanojen taivutusmuodot.</p>
        <p>Pelaaminen vaatii JavaScriptin. Lisätietoa löydät näiltä sivuilta:</p>
